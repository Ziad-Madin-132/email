<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تفعيل حسابات Gemgala - جلب أكواد OTP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --bg-card-hover: #26354a;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --font-main: 'Cairo', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 24px 16px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .badge-tag {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 4px 14px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 40%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Main OTP Checker Card */
        .otp-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 26px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .otp-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 12px;
            align-items: center;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
        }

        select, input[type="text"] {
            width: 100%;
            background: #0b1324;
            border: 1.5px solid var(--border);
            color: #fff;
            padding: 12px 16px;
            border-radius: 10px;
            font-family: var(--font-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        select:focus, input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 10px;
            font-family: var(--font-main);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #0369a1, #1d4ed8);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #334155;
            color: #f8fafc;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .btn-watch {
            background: #14532d;
            color: #4ade80;
            border: 1px solid #22c55e;
        }

        .btn-watch.active {
            background: #991b1b;
            color: #fca5a5;
            border-color: #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* Result display */
        .result-panel {
            margin-top: 22px;
            padding: 20px;
            border-radius: 12px;
            background: #0b1324;
            border: 1px solid var(--border);
            display: none;
        }

        .result-panel.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .otp-display-card {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.1), rgba(56, 189, 248, 0.08));
            border: 2px dashed var(--success);
            border-radius: 14px;
            margin-bottom: 16px;
        }

        .otp-label {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .otp-code {
            font-family: var(--font-mono);
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 8px;
            color: #4ade80;
            margin: 10px 0;
            cursor: pointer;
            user-select: all;
            display: inline-block;
        }

        .otp-code:hover {
            color: #86efac;
            text-decoration: underline;
        }

        .copy-hint {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .msg-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            text-align: right;
            direction: rtl;
        }

        .msg-body-preview {
            background: #050b14;
            padding: 12px;
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-top: 10px;
            max-height: 120px;
            overflow-y: auto;
            white-space: pre-wrap;
            direction: ltr;
            text-align: left;
        }

        /* Status Empty */
        .empty-state {
            text-align: center;
            padding: 24px;
            color: var(--text-secondary);
        }

        .empty-state .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(56, 189, 248, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Quick Accounts Table */
        .table-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 24px;
            overflow: hidden;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .table-title {
            font-size: 1.25rem;
            font-weight: 800;
        }

        .search-box {
            max-width: 280px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            font-size: 0.9rem;
        }

        th {
            background: #0b1324;
            padding: 12px 14px;
            color: var(--text-secondary);
            font-weight: 700;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }

        td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        tr:hover td {
            background: var(--bg-card-hover);
        }

        .font-mono {
            font-family: var(--font-mono);
            direction: ltr;
            display: inline-block;
        }

        .btn-xs {
            padding: 6px 10px;
            font-size: 0.78rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font-main);
            font-weight: 700;
            border: 1px solid var(--border);
            background: #0f172a;
            color: #cbd5e1;
            transition: all 0.15s ease;
        }

        .btn-xs:hover {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .btn-xs-primary {
            background: #0369a1;
            color: #fff;
            border-color: #0284c7;
        }

        .btn-xs-primary:hover {
            background: #0284c7;
            color: #fff;
        }

        .actions-cell {
            display: flex;
            gap: 6px;
            justify-content: flex-start;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--accent);
            font-weight: 700;
            font-size: 0.95rem;
            transition: transform 0.3s ease;
            z-index: 9999;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <span class="badge-tag">Gemgala Account Tool • 35 Active Inboxes</span>
        <h1>لوحة استلام وتفعيل أكواد Gemgala</h1>
        <p class="subtitle">اختر الإيميل أو اضغط على فحص الكود مباشرة لجلب الـ OTP بضغطة زر واحدة</p>
    </header>

    <!-- Quick OTP Checker Card -->
    <div class="otp-box">
        <div class="form-grid">
            <div class="input-group">
                <label for="accountSelect">اختر الحساب أو الإيميل:</label>
                <select id="accountSelect">
                    <option value="" disabled selected>جاري تحميل الحسابات...</option>
                </select>
            </div>
            <button class="btn btn-primary" id="btnCheckOtp" onclick="checkSelectedOtp()">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                فحص كود التحقق (Get OTP)
            </button>
            <button class="btn btn-watch" id="btnWatchOtp" onclick="toggleWatch()">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                <span id="watchText">مراقبة مباشرة تلقائية</span>
            </button>
        </div>

        <!-- Result Box -->
        <div class="result-panel" id="resultPanel">
            <div id="resultContent"></div>
        </div>
    </div>

    <!-- Table of All 35 Accounts -->
    <div class="table-section">
        <div class="table-header">
            <div class="table-title">قائمة الحسابات الـ 35 الجاهزة للعمل</div>
            <input type="text" class="search-box" id="searchInput" placeholder="بحث بالإيميل أو الرقم..." onkeyup="filterTable()">
        </div>
        <div class="table-wrap">
            <table id="accountsTable">
                <thead>
                    <tr>
                        <th style="width: 50px;">#</th>
                        <th>البريد الإلكتروني (Email)</th>
                        <th>المستخدم</th>
                        <th>كلمة المرور (Password)</th>
                        <th>إجراءات سريعة</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="5" style="text-align: center; color: var(--text-secondary); padding: 30px;">جاري تحميل البيانات...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="toast" id="toast">تم النسخ بنجاح!</div>

<script>
    let allAccounts = [];
    let watchInterval = null;

    // Show toast
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // Copy to clipboard
    function copyText(text, label) {
        navigator.clipboard.writeText(text).then(() => {
            showToast(`تم نسخ ${label}: ${text}`);
        }).catch(() => {
            // fallback
            const input = document.createElement('input');
            input.value = text;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            showToast(`تم نسخ ${label}: ${text}`);
        });
    }

    // Load accounts
    async function loadAccounts() {
        try {
            const res = await fetch('/api/accounts');
            allAccounts = await res.json();
            renderSelect();
            renderTable(allAccounts);
        } catch (e) {
            console.error('Error loading accounts:', e);
            document.getElementById('tableBody').innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--danger); padding: 20px;">تعذر الاتصال بالخادم المحلي. تأكد من تشغيل السيرفر.</td></tr>`;
        }
    }

    function renderSelect() {
        const sel = document.getElementById('accountSelect');
        sel.innerHTML = '';
        allAccounts.forEach(acc => {
            const opt = document.createElement('option');
            opt.value = acc.no;
            opt.innerText = `#${acc.no} - ${acc.username} (${acc.email})`;
            sel.appendChild(opt);
        });
    }

    function renderTable(list) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        list.forEach(acc => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight: 700; color: var(--accent);">${acc.no}</td>
                <td><span class="font-mono">${acc.email}</span></td>
                <td><span class="font-mono">${acc.username}</span></td>
                <td><span class="font-mono" style="color: #cbd5e1;">${acc.password}</span></td>
                <td>
                    <div class="actions-cell">
                        <button class="btn-xs btn-xs-primary" onclick="selectAndCheck(${acc.no})">فحص OTP</button>
                        <button class="btn-xs" onclick="copyText('${acc.email}', 'الإيميل')">نسخ الإيميل</button>
                        <button class="btn-xs" onclick="copyText('${acc.password}', 'كلمة السر')">نسخ الباسورد</button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function filterTable() {
        const q = document.getElementById('searchInput').value.toLowerCase().trim();
        const filtered = allAccounts.filter(a => 
            a.no.toString().includes(q) || 
            a.email.toLowerCase().includes(q) || 
            a.username.toLowerCase().includes(q)
        );
        renderTable(filtered);
    }

    function selectAndCheck(no) {
        document.getElementById('accountSelect').value = no;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        checkSelectedOtp();
    }

    async function checkSelectedOtp(silent = false) {
        const sel = document.getElementById('accountSelect');
        const accNo = sel.value;
        if (!accNo) return;

        const panel = document.getElementById('resultPanel');
        const content = document.getElementById('resultContent');
        panel.classList.add('show');

        if (!silent) {
            content.innerHTML = `
                <div class="empty-state">
                    <div class="spinner"></div>
                    <div>جاري فحص صندوق الوارد للحساب #${accNo}...</div>
                </div>
            `;
        }

        try {
            const res = await fetch(`/api/otp?target=${accNo}`);
            const data = await res.json();

            if (!data.success) {
                content.innerHTML = `<div style="color: var(--danger); text-align: center; padding: 15px;">خطأ: ${data.error || 'فشل الفحص'}</div>`;
                return;
            }

            if (data.latest_otp) {
                content.innerHTML = `
                    <div class="otp-display-card">
                        <div class="otp-label">كود تفعيل Gemgala الذي وصل الآن:</div>
                        <div class="otp-code" onclick="copyText('${data.latest_otp}', 'كود التفعيل')">${data.latest_otp}</div>
                        <div class="copy-hint">(اضغط على الكود بالماوس لنسخه فوراً)</div>
                        <button class="btn btn-primary" style="margin-top: 12px; padding: 8px 18px;" onclick="copyText('${data.latest_otp}', 'كود التفعيل')">نسخ الكود بنقرة واحدة</button>
                    </div>
                    <div class="msg-meta">
                        <div><strong>من:</strong> ${data.from || 'غير محدد'}</div>
                        <div><strong>الموضوع:</strong> ${data.subject || 'بدون عنوان'}</div>
                        <div><strong>تاريخ الاستلام:</strong> ${new Date(data.date).toLocaleTimeString('ar-EG')}</div>
                    </div>
                    <div class="msg-body-preview">${data.body || data.intro}</div>
                `;
                // If watch mode is on, stop watching once code is found
                if (watchInterval) {
                    toggleWatch();
                    showToast('تم العثور على الكود بنجاح!');
                }
            } else {
                content.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 1.1rem; color: #f8fafc; margin-bottom: 6px;">صندوق الوارد فارغ حالياً</div>
                        <div style="font-size: 0.85rem; color: var(--text-secondary);">
                            لم يصل كود بعد لهذا الحساب. اطلب كود التفعيل من تطبيق <strong>Gemgala</strong>، ثم اضغط على زر "فحص كود التحقق" مرة أخرى أو شغّل المراقبة المباشرة.
                        </div>
                    </div>
                `;
            }
        } catch (e) {
            content.innerHTML = `<div style="color: var(--danger); text-align: center; padding: 15px;">فشل الاتصال: ${e.message}</div>`;
        }
    }

    function toggleWatch() {
        const btn = document.getElementById('btnWatchOtp');
        const text = document.getElementById('watchText');

        if (watchInterval) {
            clearInterval(watchInterval);
            watchInterval = null;
            btn.classList.remove('active');
            text.innerText = 'مراقبة مباشرة تلقائية';
        } else {
            btn.classList.add('active');
            text.innerText = 'جاري المراقبة المباشرة... (إيقاف)';
            checkSelectedOtp();
            watchInterval = setInterval(() => {
                checkSelectedOtp(true);
            }, 3000);
        }
    }

    // Auto initialize
    window.addEventListener('DOMContentLoaded', loadAccounts);
</script>

</body>
</html>
